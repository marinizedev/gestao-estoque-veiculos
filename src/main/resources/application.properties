spring.config.import=optional:file:.env[.properties]

spring.application.name=gestao-estoque-veiculos
server.port=8080

# Credenciais do banco, fornecidas pelo .env
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestao_estoque_veiculos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Conta ADMIN, fornecida pelo .env
app.security.admin.username=${APP_ADMIN_USERNAME}
app.security.admin.password=${APP_ADMIN_PASSWORD}

# Configurações da sessão
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
